name: Receive owner submissions through the native Koios application
on:
  issues:
    types: [opened, reopened, edited]
permissions:
  contents: read
concurrency:
  group: koios-owner-editorial-intake
  cancel-in-progress: false
jobs:
  editorial-intake:
    if: >-
      ${{ github.repository == 'causeway-services/koios.news' && github.event.issue.user.login == 'emsenn' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && !contains(github.event.issue.body, '<!-- koios-feedback:') }}
    runs-on: [self-hosted, Linux, X64, guix, cold-red-gate, koios-news]
    steps:
      - name: Wake the LAGOON-declared FeltOS job
        run: systemctl --user start --no-block koios-news-561-group-job-newsroom-cycle.service
