name: Publisher entity and article structured data
on:
  pull_request:
    paths:
      - 'src/render/templates.mjs'
      - 'src/render/head.mjs'
      - 'test/structured-data.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/publisher-entity.yml'
  push:
    branches: [main]
    paths:
      - 'src/render/templates.mjs'
      - 'src/render/head.mjs'
      - 'test/structured-data.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/publisher-entity.yml'
permissions:
  contents: read
jobs:
  structured-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check original publisher source
        run: |
          node --check src/render/templates.mjs
          node --check src/render/head.mjs
          node --check test/structured-data.test.mjs
      - name: Install original declared dependencies without substituting fixtures
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build original publisher fixture and validate identity/metadata
        run: node --test test/structured-data.test.mjs
      - name: Verify original publisher test suite
        run: pnpm test
