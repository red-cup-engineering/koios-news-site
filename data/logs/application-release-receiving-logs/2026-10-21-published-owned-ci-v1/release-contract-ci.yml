name: Koios release contract CI
on:
  pull_request:
    paths:
      - .github/workflows/site.yml
      - .github/workflows/release-contract-ci.yml
      - scripts/release-site.mjs
      - scripts/release-site-observation.mjs
      - scripts/observe-site-release.mjs
      - scripts/observe-provider-state.mjs
      - test/release-site.test.mjs
      - test/release-site-observation.test.mjs
      - test/observe-site-release.test.mjs
      - .github/workflows/editorial-feedback.yml
      - scripts/observe-newsroom-runtime.mjs
      - scripts/newsroom-feedback.mjs
      - scripts/collect-feedback.mjs
      - src/news-line/unpublished-corpus.mjs
      - test/unpublished-corpus.test.mjs
      - test/observe-newsroom-runtime.test.mjs
      - deploy/maintain-newsroom.sh
      - deploy/maintenance-finalization.sh
      - scripts/finish-maintenance-feedback.mjs
      - test/maintenance-finalization.test.mjs
      - test/maintenance-startup-finalization.test.mjs
      - scripts/publish-feedback.mjs
      - scripts/push-data.mjs
      - test/feedback-issue-custody.test.mjs
      - test/fixtures/release-site-fetch.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/site.yml
      - .github/workflows/release-contract-ci.yml
      - scripts/release-site.mjs
      - scripts/release-site-observation.mjs
      - scripts/observe-site-release.mjs
      - scripts/observe-provider-state.mjs
      - test/release-site.test.mjs
      - test/release-site-observation.test.mjs
      - test/observe-site-release.test.mjs
      - .github/workflows/editorial-feedback.yml
      - scripts/observe-newsroom-runtime.mjs
      - scripts/newsroom-feedback.mjs
      - scripts/collect-feedback.mjs
      - src/news-line/unpublished-corpus.mjs
      - test/unpublished-corpus.test.mjs
      - test/observe-newsroom-runtime.test.mjs
      - deploy/maintain-newsroom.sh
      - deploy/maintenance-finalization.sh
      - scripts/finish-maintenance-feedback.mjs
      - test/maintenance-finalization.test.mjs
      - test/maintenance-startup-finalization.test.mjs
      - scripts/publish-feedback.mjs
      - scripts/push-data.mjs
      - test/feedback-issue-custody.test.mjs
      - test/fixtures/release-site-fetch.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-contract:
    # Source-only syntax and isolated tests run independently of production.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify supported installed Node runtime
        run: node -e 'const [major,minor]=process.versions.node.split(".").map(Number); console.log(process.version); if(major<22 || (major===22 && minor<18)) process.exit(1)'
      # The released Cloudflare carrier is a workspace: dependency-bound integration
      # tests need the admitted Guix closure, not an isolated Actions checkout.
      - name: Check release script syntax without importing unavailable workspace packages
        run: node --check scripts/release-site.mjs && node --check scripts/collect-feedback.mjs && node --check src/news-line/unpublished-corpus.mjs
      - name: Run dependency-free release-observation and workflow regression tests
        run: node --test test/release-site-observation.test.mjs test/observe-site-release.test.mjs test/observe-newsroom-runtime.test.mjs test/maintenance-finalization.test.mjs test/maintenance-startup-finalization.test.mjs test/feedback-issue-custody.test.mjs test/unpublished-corpus.test.mjs

